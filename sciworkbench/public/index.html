<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOCUS · 科研上下文工作台</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="locus-note" content="本地开发版：左栏 导航/本页列表 · 中栏 主工作区 · 右栏 规范识别结果；AI 配置仅进程内存" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">LOCUS</span><span class="sub">科研上下文工作台</span></div>
    <div id="curtopic" class="curtopic-slot"></div>
    <div class="status" id="status">连接中…</div>
  </header>

  <details class="aiconfig" id="aiconfig">
    <summary><strong>AI 配置</strong> <span class="hint" id="ai-state">读取中…</span></summary>
    <div class="row">
      <input id="ai-base" placeholder="接口地址 baseUrl" />
      <input id="ai-model" placeholder="模型名" />
      <input id="ai-key" type="password" placeholder="Key（仅进程内存，不落盘/日志/Git）" />
      <input id="ai-timeout" type="number" min="5" max="600" placeholder="超时(秒) 默认120" />
      <button class="primary" id="ai-save">保存配置</button>
      <button id="ai-clear">清除</button>
    </div>
    <p class="hint" id="ai-msg"></p>
  </details>

  <div class="app">
    <!-- 左：导航（上层）＋ 本页列表（下层） -->
    <aside class="pane left">
      <nav class="nav" id="nav"></nav>
      <div id="err-left"></div>
      <div id="sec-materials">
        <div class="pane-title" id="materials-title">材料</div>
        <div class="materials" id="material-list"></div>
      </div>
    </aside>

    <!-- 中：主工作区 -->
    <main class="pane mid">
      <div class="pane-title" id="mid-title">工作区</div>
      <div id="err-mid"></div>
      <div id="create-area"></div>
      <div id="tools-area"></div>
      <div class="pane-note" id="mid-note" hidden></div>
      <pre class="source" id="mid-content">在左栏选择或创建对象。</pre>
    </main>

    <!-- 右：规范识别结果 -->
    <aside class="pane right">
      <div class="pane-title" id="right-title">结果</div>
      <div id="err-right"></div>
      <div id="right-content"><p class="hint">在左栏选择对象后，这里显示对应的结构化结果与操作。</p></div>
    </aside>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head"><strong id="drawer-title">修订历史</strong><button id="drawer-close">关闭</button></div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div id="drawer-body"></div>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
