<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOCUS · 科研上下文工作台</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="locus-note" content="本地开发版：左栏 导航/本页列表 · 中栏 主工作区 · 右栏 规范识别结果；模型设置在左栏底部（保存后本机留存，不入库）" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">LOCUS</span><span class="sub">科研上下文工作台</span></div>
    <div id="curtopic" class="curtopic-slot"></div>
    <div class="status" id="status">连接中…</div>
  </header>

  <div class="app">
    <!-- 领域知识页专用：窄导航条（可点开） -->
    <nav class="navrail" id="navrail" hidden></nav>
    <!-- 左：导航（上层）＋ 本页列表（下层）；领域知识页切为原文区 -->
    <aside class="pane left">
      <div class="leftscroll">
        <nav class="nav" id="nav"></nav>
        <div id="err-left"></div>
        <div id="kz-left" hidden></div>
        <div id="sec-materials">
          <div class="pane-title" id="materials-title">材料</div>
          <div class="materials" id="material-list"></div>
        </div>
      </div>
      <div class="leftfoot">
        <button id="ai-open" class="modelbtn">模型设置 <span class="hint" id="ai-state">读取中…</span></button>
      </div>
    </aside>

    <!-- 中：主工作区 -->
    <main class="pane mid">
      <div class="pane-title" id="mid-title">工作区</div>
      <div id="err-mid"></div>
      <div id="create-area"></div>
      <div id="tools-area"></div>
      <div class="pane-note" id="mid-note" hidden></div>
      <pre class="source" id="mid-content">在左栏选择或创建对象。</pre>
    </main>

    <!-- 右：规范识别结果 -->
    <aside class="pane right">
      <div class="pane-title" id="right-title">结果</div>
      <div id="err-right"></div>
      <div id="right-content"><p class="hint">在左栏选择对象后，这里显示对应的结构化结果与操作。</p></div>
    </aside>
  </div>

  <aside class="navdrawer" id="navdrawer" hidden>
    <div class="nd-head"><strong>导航</strong><button id="nd-close">关闭</button></div>
    <div class="nd-list" id="nd-list"></div>
  </aside>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head"><strong id="drawer-title">修订历史</strong><button id="drawer-close">关闭</button></div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div id="drawer-body"></div>
  </aside>

  <!-- 模型设置（左下角入口打开）：保存后本机留存（数据目录 ai-config.json），不入库 -->
  <aside class="drawer" id="aipanel" hidden>
    <div class="drawer-head"><strong>模型设置</strong><button id="ai-close">关闭</button></div>
    <div class="drawer-meta" id="ai-state-2">读取中…</div>
    <div class="row"><input id="ai-base" placeholder="接口地址 baseUrl" /></div>
    <div class="row"><input id="ai-model" placeholder="模型名" /></div>
    <div class="row"><input id="ai-key" type="password" placeholder="Key（保存后本机留存，不入库）" /></div>
    <div class="row"><input id="ai-timeout" type="number" min="5" max="600" placeholder="超时(秒) 默认120" /></div>
    <div class="row">
      <button class="primary" id="ai-save">保存配置</button>
      <button id="ai-test">测试连接</button>
      <button id="ai-models">检测可用模型</button>
      <button id="ai-clear">清除</button>
    </div>
    <p class="hint" id="ai-msg"></p>
    <div id="ai-models-list" hidden></div>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
