<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOCUS · 科研上下文工作台</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="locus-note" content="本地开发版：左栏 课题/材料 · 中栏 原始材料 · 右栏 结构化结果；AI 配置仅进程内存；样例须为 approved 公开材料" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">LOCUS</span><span class="sub">科研上下文工作台</span></div>
    <div class="status" id="status">连接中…</div>
  </header>

  <details class="aiconfig" id="aiconfig">
    <summary><strong>AI 配置</strong> <span class="hint" id="ai-state">读取中…</span></summary>
    <div class="row">
      <input id="ai-base" placeholder="接口地址 baseUrl（如 https://api.agnes-ai.cn/v1）" />
      <input id="ai-model" placeholder="模型名" />
      <input id="ai-key" type="password" placeholder="Key（仅进程内存，不落盘/日志/Git）" />
      <input id="ai-timeout" type="number" min="5" max="600" placeholder="超时(秒) 默认120" />
      <button class="primary" id="ai-save">保存配置</button>
      <button id="ai-clear">清除</button>
    </div>
    <p class="hint">仅当前服务进程内存，重启失效；保存后清空 Key 输入，页面只显示非敏感状态。</p>
  </details>

  <div class="banner" id="banner" hidden></div>

  <div class="app">
    <!-- 左：课题 / 子问题 / 材料 -->
    <aside class="pane left">
      <nav class="nav" id="nav">
        <button class="navitem active" data-nav="literature">文献证据</button>
        <button class="navitem" data-nav="measurement">实验数据</button>
        <button class="navitem" data-nav="protocol">方案与图</button>
        <button class="navitem" data-nav="record">实验记录</button>
        <button class="navitem disabled" disabled title="未实现（阶段5）">分析 <em>未实现</em></button>
        <button class="navitem disabled" disabled title="未实现（阶段6）">产出 <em>未实现</em></button>
      </nav>
      <p class="hint" id="nav-hint"></p>

      <div class="pane-title">课题</div>
      <select id="topic-select"></select>
      <details class="mini">
        <summary>新建课题（仅名称＋研究问题）</summary>
        <input id="topic-name" placeholder="课题名称" />
        <input id="topic-q" placeholder="研究问题" />
        <button id="topic-create">创建课题</button>
      </details>

      <div class="pane-title">子问题</div>
      <ul class="subq" id="subq-list"></ul>
      <details class="mini">
        <summary>新建子问题</summary>
        <input id="subq-q" placeholder="子问题" />
        <select id="subq-kind"><option value="declared">已声明</option><option value="exploratory">探索性</option></select>
        <button id="subq-create">创建子问题</button>
      </details>

      <div class="pane-title">材料</div>
      <div id="import-box"></div>
      <div class="materials" id="material-list"></div>

      <div id="lit-tools"></div>
    </aside>

    <!-- 中：原始材料 -->
    <main class="pane mid">
      <div class="pane-title" id="mid-title">原始材料</div>
      <div class="pane-note" id="mid-note" hidden></div>
      <pre class="source" id="mid-content">在左栏选择或导入材料。</pre>
    </main>

    <!-- 右：结构化结果 -->
    <aside class="pane right">
      <div class="pane-title" id="right-title">结构化结果</div>
      <div id="right-content"><p class="hint">选中材料后，这里显示对应的结构化草稿与核对操作。</p></div>
    </aside>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head"><strong id="drawer-title">修订历史</strong><button id="drawer-close">关闭</button></div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div id="drawer-body"></div>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
