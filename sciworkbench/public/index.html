<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOCUS · 最小闭环（本地开发版）</title>
  <link rel="stylesheet" href="/styles.css" />
  <meta name="locus-note" content="本地开发版：AI 解析需启动时用环境变量配置；存储=本地文件，可替换；样例须为 approved 公开材料" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">LOCUS</span><span class="sub">科研上下文工作台 · 最小闭环</span></div>
    <div class="status" id="status">连接中…</div>
  </header>

  <div class="aibar" id="aibar"></div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="literature" role="tab">文献证据流程</button>
    <button class="tab" data-tab="measurement" role="tab">实验数据流程</button>
  </nav>

  <main>
    <!-- 文献证据路径 -->
    <section id="panel-literature" class="panel active">
      <div class="import card">
        <h2>导入文献摘录</h2>
        <p class="hint">导入文本 → 生成证据卡。<strong>draft</strong>=按行草稿；<strong>AI</strong>=调用文献抽取任务（独立提示词/结构）。公开材料须为 approved 且署名来源。</p>
        <input id="lit-name" type="text" placeholder="来源名称（如 SLAC methods-source）" />
        <textarea id="lit-text" rows="5" placeholder="粘贴文献摘录 / 方法节选文本…"></textarea>
        <div class="row">
          <label>抽取方式</label>
          <select id="lit-mode"><option value="draft">draft（按行草稿）</option><option value="ai">AI（文献抽取任务）</option></select>
          <button class="primary" id="lit-import">导入并生成证据卡</button>
        </div>
      </div>
      <div class="list" id="lit-list"></div>
    </section>

    <!-- 实验数据路径 -->
    <section id="panel-measurement" class="panel">
      <div class="import card">
        <h2>导入实验数据（CSV）</h2>
        <p class="hint">导入后保留<strong>表格结构</strong>，按列核对单位/结论；单元格可更正但需原因。超上限的文件将被<strong>拒绝</strong>（不截断）。</p>
        <input id="meas-name" type="text" placeholder="文件名（如 EnzymeML_SLAC_pH3__Data.csv）" />
        <input id="meas-file" type="file" accept=".csv,text/csv,text/plain" />
        <textarea id="meas-text" rows="3" placeholder="或直接粘贴 CSV 内容…"></textarea>
        <button class="primary" id="meas-import">导入并生成表格</button>
      </div>
      <div class="list" id="meas-list"></div>
    </section>
  </main>

  <!-- 抽屉：原件回查 / 历史 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <strong id="drawer-title">原件回查</strong>
      <button id="drawer-close">关闭</button>
    </div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <pre class="source" id="drawer-source"></pre>
    <div id="drawer-history"></div>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
