  <aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
    <div class="drawer-head"><strong id="drawer-title">修订历史</strong><button id="drawer-close" type="button">关闭</button></div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div id="drawer-body"></div>
  </aside>

  <aside class="drawer topic-switcher" id="topic-switcher" hidden role="dialog" aria-modal="true" aria-label="切换课题" tabindex="-1">
    <div class="drawer-head"><strong>切换课题</strong><button id="ts-close" type="button">关闭</button></div>
    <input id="ts-search" class="ts-search" placeholder="搜索课题名称或研究问题" aria-label="搜索课题" />
    <div class="ts-list" id="ts-list"></div>
    <details class="ts-newbox"><summary>新建课题</summary>
      <div class="ts-newform">
        <input id="ts-new-name" placeholder="课题名称" />
        <input id="ts-new-q" placeholder="研究问题（可选）" />
        <button class="primary" id="ts-new-create" type="button">开卷</button>
      </div>
    </details>
  </aside>

<div class="scroll-switch" id="scroll-switch" hidden aria-hidden="true">
    <div class="scroll-panel top"></div>
    <div class="scroll-panel bottom"></div>
    <div class="scroll-mark">迹</div>
    <div class="scroll-caption">换卷</div>
  </div>

  <div class="replay-layer" id="replay-layer" hidden aria-hidden="true">
    <div class="replay-blueprint" id="replay-blueprint"></div>
    <div class="replay-caption">换卷 · 重绘</div>
  </div>

  <script type="module" src="/app.js"></script>
  <script src="/splash.js"></script>
  <script>
    // 直接打开文件或被错误根目录的静态预览打开时，external css/js 会 404，
    // 页面会变成一堆裸文字；这里兜底提示正确的服务入口。
    (function () {
      function check() {
        var ok = false;
        try {
          var tb = document.querySelector(".topbar");
          ok = !!(tb && getComputedStyle(tb).position === "relative" && window.__locusSplash);
        } catch (e) {}
        if (!ok) document.documentElement.dataset.boot = "fail";
      }
      if (location.protocol === "file:") document.documentElement.dataset.boot = "fail";
      else window.addEventListener("load", check);
    })();
  </script>
</body>
</html>
